name: RC wallet persistence fault-injection (no packaging)

on:
  push:
    branches:
      - fix/rc-wallet-persistence-A
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sanity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and fail-closed source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile qa/rc-edge/wallet_persistence.py qa/rc-edge/instrument.py
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path('src/wallet/wallet.cpp').read_text()
          fn = cpp.split('bool CWallet::CommitTransaction(', 1)[1].split('bool CWallet::AddAccountingEntry(', 1)[0]
          checks = [
              'wtxNew.AcceptToMemoryPool(false)' in fn,
              'if (!AddToWallet(wtxNew, false, pwalletdb))' in fn,
              'txid=%s' in fn and 'Do not retry' in fn,
              'return false; // Do not relay or claim success.' in fn,
              fn.index('wtxNew.AcceptToMemoryPool(false)') <
                fn.index('if (!AddToWallet(wtxNew, false, pwalletdb))') <
                fn.index('wtxNew.RelayWalletTransaction('),
              '&strError' in Path('src/wallet/rpcwallet.cpp').read_text(),
              '&commitError' in Path('src/qt/walletmodel.cpp').read_text(),
          ]
          assert all(checks), 'Wallet commit safety invariant is missing'
          print('PASS: Python syntax and wallet failure-path source invariants; runtime regtest NOT run')
          PY

  wallet-failure-regtest:
    # Avoid automatically starting expensive packaging/builds on every test
    # commit. Trigger manually once runner dependency networking is available.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Export source and build existing PEPEPOW toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/build"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/source"
          docker build --network=host -t pepe-wallet-edge -f contrib/linux-portable/Dockerfile contrib/linux-portable
      - name: Build daemon/CLI with ASan and test isolated regtest wallet
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/source:/source" -v "$RUNNER_TEMP/build:/build" \
            -e EDGE_BUILD=/build/src \
            pepe-wallet-edge bash -euc '
              python3 /source/qa/rc-edge/instrument.py /source
              cd /source && ./autogen.sh
              cd /build
              /source/configure --with-gui=no --without-miniupnpc --enable-tests --disable-bench --disable-zmq \
                CPPFLAGS=-I/opt/db4/include LDFLAGS="-L/opt/db4/lib -fsanitize=address" \
                CFLAGS="-O1 -g1 -fsanitize=address -fno-omit-frame-pointer" \
                CXXFLAGS="-O1 -g1 -fsanitize=address -fno-omit-frame-pointer -include deque -include condition_variable"
              make -C src -j4 PEPEPOWd PEPEPOW-cli
              python3 /source/qa/rc-edge/wallet_persistence.py
            '
